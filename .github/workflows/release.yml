name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          cat << 'EOF' > release_notes.md
          ## Docker

          Pull from Docker Hub:
          ```bash
          docker pull muness/roon-extension-hqp-profile-switcher:${{ steps.version.outputs.version }}
          # or
          docker pull muness/roon-extension-hqp-profile-switcher:latest
          ```

          ### Docker Compose

          ```yaml
          services:
            hqp-profile-switcher:
              image: docker.io/muness/roon-extension-hqp-profile-switcher:latest
              container_name: hqp-profile-switcher
              restart: unless-stopped
              environment:
                - TZ=UTC
                - ROON_EXTENSION_PORT=9330
                - HQP_UI_PORT=9331
                - HQP_RESTART_GRACE_MS=10000
              ports:
                - "9330:9330/tcp"
                - "9330:9330/udp"
                - "9331:9331/tcp"
              volumes:
                - hqp-profile-switcher-data:/home/node/app/data

          volumes:
            hqp-profile-switcher-data:
          ```

          ## Links

          - [Docker Hub](https://hub.docker.com/r/muness/roon-extension-hqp-profile-switcher)
          - [Documentation](https://github.com/muness/roon-extension-hqp-profile-switcher#readme)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          generate_release_notes: true
          append_body: true
