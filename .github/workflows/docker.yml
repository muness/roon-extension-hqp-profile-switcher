name: Docker Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: docker.io
  IMAGE_NAME: muness/roon-extension-hqp-profile-switcher

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # edge tag for main branch pushes
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            # latest tag for version tags
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # version tag (e.g., v1.2.0 -> 1.2.0)
            type=semver,pattern={{version}}
            # major.minor tag (e.g., v1.2.0 -> 1.2)
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          cat << EOF > release_notes.md
          ## Docker

          Pull from Docker Hub:
          \`\`\`bash
          docker pull muness/roon-extension-hqp-profile-switcher:${{ steps.version.outputs.version }}
          # or
          docker pull muness/roon-extension-hqp-profile-switcher:latest
          \`\`\`

          ### Docker Compose

          \`\`\`yaml
          services:
            hqp-profile-switcher:
              image: docker.io/muness/roon-extension-hqp-profile-switcher:latest
              container_name: hqp-profile-switcher
              restart: unless-stopped
              environment:
                - TZ=UTC
                - ROON_EXTENSION_PORT=9330
                - HQP_UI_PORT=9331
                - HQP_RESTART_GRACE_MS=10000
              ports:
                - "9330:9330/tcp"   # Roon extension
                - "9330:9330/udp"   # Roon discovery
                - "9331:9331/tcp"   # Web UI
              volumes:
                - hqp-profile-switcher-data:/home/node/app/data

          volumes:
            hqp-profile-switcher-data:
          \`\`\`

          ## Links

          - [Docker Hub](https://hub.docker.com/r/muness/roon-extension-hqp-profile-switcher)
          - [Documentation](https://github.com/muness/roon-extension-hqp-profile-switcher#readme)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          generate_release_notes: true
          append_body: false
